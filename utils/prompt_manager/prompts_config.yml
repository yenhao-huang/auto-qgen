  system_role: 你是一資料分析專家。
  task: 請根據以下正式的統計資料，生成3-5個不同的口語化查詢句子，這些句子是專業人員可能會用來搜尋這項資料的自然語言問句。
  requirements:
  - 生成的查詢句子要自然、口語化，符合專業人員的表達習慣
