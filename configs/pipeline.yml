# 測試配置 - Mixed Pipeline
# 自動檢測並處理混合格式檔案（Excel, PDF, Image）
# 注意：此配置會根據目錄中的檔案類型自動選擇 pipeline

# Pipeline 類型：auto 會自動檢測
pipeline_type: auto

# 輸入文件路徑（目錄包含多種格式）
input: tests/testcases/test_model/pdf

# Metadata（選用）
metadata:
  test_name: "test_model"
  description: "測試模型"

# Excel Pipeline 設定（如果檢測到 Excel 檔案）
excel:
  skip_parser: false
  output_dir: "tests/results/test_model/excel"

  parser:
    prompt_name: excel_parser
    llm:
      url: "http://192.168.1.78:3111/v1/chat/completions"
      model: gpt-oss-20b
      api_key: null
      use_openrouter: false
      max_retries: 3

  augmenter:
    prompt_name: "default"
    mode: vllm

    vllm:
      url: http://192.168.1.78:3111/v1/chat/completions
      model_name: gpt-oss-20b
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.9
      frequency_penalty: 0.1
      presence_penalty: 0.1
      is_thinking_mode: true
      limit_llmoutput_scheme: false

# Image Pipeline 設定（如果檢測到圖片檔案）
image:
  ocr:
    output_dir: tests/results/test_model/png
    engine: dotsocr
    mode: vllm

    vllm:
      url: http://192.168.1.76:3264/v1/chat/completions
      model_name: /workspace/llm_model
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.9
      frequency_penalty: 0.1
      presence_penalty: 0.1
      timeout: 3600

    recursive: true

  gen_ques:
    output_dir: tests/results/test_model/png
    mode: vllm

    vllm:
      url: http://192.168.1.78:3111/v1/chat/completions
      model_name: gpt-oss-20b
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.9
      frequency_penalty: 0.1
      presence_penalty: 0.1
      is_thinking_mode: True
      limit_llmoutput_scheme: false

    prompt_name: default
    verify_connection: False

  ocr_only: false

# PDF Pipeline 設定（如果檢測到 PDF 檔案）
pdf:
  conversion:
    dpi: 200
    format: PNG
    max_size: 1024

  ocr:
    output_dir: tests/results/test_model/pdf
    engine: dotsocr
    mode: vllm

    vllm:
      url: http://192.168.1.76:3264/v1/chat/completions
      model_name: /workspace/llm_model
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.9
      frequency_penalty: 0.1
      presence_penalty: 0.1
      timeout: 3600

    recursive: true

  gen_ques:
    output_dir: tests/results/test_model/pdf
    mode: vllm

    vllm:
      url: http://192.168.1.78:3111/v1/chat/completions
      model_name: gpt-oss-20b
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.9
      frequency_penalty: 0.1
      presence_penalty: 0.1
      is_thinking_mode: True
      limit_llmoutput_scheme: false

    prompt_name: default
    verify_connection: False

  ocr_only: false
