# 問題生成配置文件
# 從 Ground Truth 資料生成問題，用於 benchmark 測試

# 輸入檔案路徑（Ground Truth JSON）
input: results/ocr/batch_ocr.json

# 輸出檔案路徑（Benchmark JSON）
output_dir: results/ocr/

# LLM 模式：vllm 或 openrouter
mode: vllm

# VLLM 配置（當 mode=vllm 時使用)
vllm:
  url: http://192.168.1.79:8074/v1/chat/completions
  model_name: gemma-12b
  # LLM 生成參數
  max_tokens: 4096
  temperature: 0.7
  top_p: 0.9
  frequency_penalty: 0.1
  presence_penalty: 0.1
  is_thinking_mode: True
  limit_llmoutput_scheme: false

prompt_name: default

# 初始化時是否驗證 API 連線（預設：false）
verify_connection: False
