# Excel Parser LLM + Augmenter Pipeline 配置檔案

# 輸入/輸出設定
input:
  file: "data/raw_data/vedio/youtube_100_records.xlsx"

output:
  dir: "results/pipeline"  # 留空則使用時間戳命名: results/pipeline_{timestamp}
  parsed_data: null  # 留空則使用: {dir}/parsed_data.json
  augmented_queries: null  # 留空則使用: {dir}/augmented_queries.json

# Parser LLM 設定
parser:
  llm:
    url: "http://192.168.1.79:3472"
    model: "gemma-12b-8bit"
    api_key: null
    use_openrouter: false
    max_retries: 3
    max_tokens: 8000
    temperature: 0.3
    top_p: 0.9

# Augmenter LLM 設定
augmenter:
  llm:
    url: "http://192.168.1.79:3472"
    model: "gemma-12b-8bit"
    api_key: null
    use_openrouter: false
    max_retries: 3
  prompt_name: "1"

# 執行選項
options:
  skip_parser: false  # 跳過 Parser 步驟
  quiet: false  # 安靜模式
