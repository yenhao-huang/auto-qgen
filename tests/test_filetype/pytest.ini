[pytest]
# pytest 配置文件

# 測試路徑
testpaths = .

# Python 文件模式
python_files = test_*.py

# Python 類別模式
python_classes = Test*

# Python 函數模式
python_functions = test_*

# 最小版本要求
minversion = 6.0

# 添加選項
addopts =
    # 顯示摘要信息
    -ra
    # 嚴格模式
    --strict-markers
    # 顯示本地變量
    --showlocals
    # 詳細輸出
    --verbosity=1

# 定義 markers
markers =
    skip: 標記需要實際服務運行的測試，通常會被跳過
    slow: 標記執行時間較長的測試
    integration: 標記集成測試
    unit: 標記單元測試

# 控制台輸出樣式
console_output_style = progress

# 日誌格式
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 過濾警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
